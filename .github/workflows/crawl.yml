name: Weekly Steam Demo Crawl

on:
  schedule:
    # Every Monday at 09:00 UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:
    inputs:
      recency_days:
        description: 'Demos released within N days (0 = no cutoff)'
        required: false
        default: '7'
      max_demos:
        description: 'Maximum number of demos to fetch'
        required: false
        default: '100'

permissions:
  contents: read

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run crawler
        id: crawl
        env:
          RECENCY_DAYS: ${{ github.event.inputs.recency_days || '7' }}
          MAX_DEMOS: ${{ github.event.inputs.max_demos || '100' }}
        run: |
          output=$(npm run crawl 2>&1)
          echo "$output"
          count=$(echo "$output" | grep -oP 'Done — \K\d+')
          echo "demo_count=${count:-0}" >> "$GITHUB_OUTPUT"

      - name: Upload report artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: steam-demo-report
          path: dist/index.html
          retention-days: 7

      - name: Notify Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          DEMO_COUNT: ${{ steps.crawl.outputs.demo_count }}
          RECENCY_DAYS: ${{ github.event.inputs.recency_days || '7' }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          curl -s -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -d "{
              \"blocks\": [
                {
                  \"type\": \"header\",
                  \"text\": { \"type\": \"plain_text\", \"text\": \"🎮 Steam Mac Demo Report Ready\" }
                },
                {
                  \"type\": \"section\",
                  \"fields\": [
                    { \"type\": \"mrkdwn\", \"text\": \"*Demos found*\n${DEMO_COUNT}\" },
                    { \"type\": \"mrkdwn\", \"text\": \"*Period*\nLast ${RECENCY_DAYS} days\" }
                  ]
                },
                {
                  \"type\": \"actions\",
                  \"elements\": [
                    {
                      \"type\": \"button\",
                      \"style\": \"primary\",
                      \"text\": { \"type\": \"plain_text\", \"text\": \"Download report\" },
                      \"url\": \"${ARTIFACT_URL}\"
                    }
                  ]
                }
              ]
            }"
