name: Weekly Steam Demo Crawl

on:
  workflow_dispatch:
    inputs:
      recency_days:
        description: 'Demos released within N days (0 = no cutoff)'
        required: false
        default: '7'
      max_demos:
        description: 'Maximum number of demos to fetch'
        required: false
        default: '100'
      max_age_days:
        description: 'Remove demos added more than N days ago (0 = keep all)'
        required: false
        default: '180'

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Run crawler
        id: crawl
        env:
          RECENCY_DAYS: ${{ github.event.inputs.recency_days || '7' }}
          MAX_DEMOS: ${{ github.event.inputs.max_demos || '100' }}
          MAX_AGE_DAYS: ${{ github.event.inputs.max_age_days || '180' }}
        run: |
          output=$(pnpm run crawl 2>&1)
          echo "$output"
          new_count=$(echo "$output" | grep -oP '\d+(?= new demos added)')
          total=$(echo "$output" | grep -oP '\d+(?= total in database)')
          echo "new_count=${new_count:-0}" >> "$GITHUB_OUTPUT"
          echo "total=${total:-0}" >> "$GITHUB_OUTPUT"

      - name: Commit and push database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/demos.json
          git diff --staged --quiet || git commit -m "chore: update demo database [skip ci]"
          git push

      - name: Notify Slack (failure)
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -s -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -d "{\"text\": \"⚠️ Steam demo crawl failed. <${RUN_URL}|View run>\"}"

      - name: Notify Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          NEW_COUNT: ${{ steps.crawl.outputs.new_count }}
          TOTAL: ${{ steps.crawl.outputs.total }}
          PAGES_URL: "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
        run: |
          curl -s -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -d "{
              \"blocks\": [
                {
                  \"type\": \"header\",
                  \"text\": { \"type\": \"plain_text\", \"text\": \"🎮 Steam Mac Demo Report Ready\" }
                },
                {
                  \"type\": \"section\",
                  \"fields\": [
                    { \"type\": \"mrkdwn\", \"text\": \"*New demos*\n${NEW_COUNT}\" },
                    { \"type\": \"mrkdwn\", \"text\": \"*Total in database*\n${TOTAL}\" }
                  ]
                },
                {
                  \"type\": \"actions\",
                  \"elements\": [
                    {
                      \"type\": \"button\",
                      \"style\": \"primary\",
                      \"text\": { \"type\": \"plain_text\", \"text\": \"View report\" },
                      \"url\": \"${PAGES_URL}\"
                    }
                  ]
                }
              ]
            }"
